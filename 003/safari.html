<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Safari</title>
    <style>
        :root {
            --menubar-h: 28px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 全局菜单栏 ===== */
        .menubar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: calc(var(--menubar-h) + var(--safe-top));
            padding: var(--safe-top) 12px 0;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            display: flex;
            align-items: center;
            font-size: 14px;
            z-index: 10000;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            user-select: none;
        }
        .menubar .apple-logo {
            width: 18px;
            height: 18px;
            margin-right: 16px;
            cursor: pointer;
            fill: #1d1d1f;
            flex-shrink: 0;
        }
        .menubar .menu-item {
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: default;
            color: #1d1d1f;
            white-space: nowrap;
        }
        .menubar .menu-item.bold { font-weight: 700; }
        .menubar .menu-item:hover { background: #007aff; color: #fff; border-radius: 4px; }
        .menubar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #1d1d1f;
            white-space: nowrap;
        }
        .menubar-right svg {
            width: 18px; height: 18px;
            fill: #1d1d1f;
            opacity: 0.9;
            flex-shrink: 0;
        }

        /* ===== Safari 应用全屏容器 ===== */
        .app-container {
            position: fixed;
            top: calc(var(--menubar-h) + var(--safe-top));
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        /* 浏览器工具栏 */
        .browser-toolbar {
            height: 52px;
            background: rgba(245, 245, 247, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }
        .traffic-lights {
            display: flex;
            gap: 8px;
            margin-right: 12px;
        }
        .tl-btn {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .tl-close { background: #ff5f57; }
        .tl-close:hover { background: #ff3b30; }
        .tl-min { background: #febc2e; }
        .tl-zoom { background: #28c840; }

        .nav-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
            opacity: 0.7;
            flex-shrink: 0;
        }
        .nav-btn:hover { background: rgba(0,0,0,0.08); opacity: 1; }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .url-bar {
            flex: 1;
            height: 30px;
            min-width: 0;
            border-radius: 8px;
            background: rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }
        .url-bar svg {
            width: 16px; height: 16px;
            fill: #86868b;
            flex-shrink: 0;
        }
        .url-bar input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            color: #1d1d1f;
        }

        .share-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
            opacity: 0.7;
            flex-shrink: 0;
        }
        .share-btn:hover { background: rgba(0,0,0,0.08); opacity: 1; }
        .share-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* 标签页 */
        .tab-bar {
            height: 36px;
            background: rgba(240, 240, 242, 0.9);
            display: flex;
            align-items: flex-end;
            padding: 0 12px;
            gap: 2px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab {
            height: 28px;
            padding: 0 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 200px;
            min-width: 120px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .tab.active {
            background: #fff;
            font-weight: 500;
        }
        .tab-new {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #86868b;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .tab-new:hover { background: rgba(0,0,0,0.08); color: #1d1d1f; }

        /* 浏览器内容区 */
        .browser-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #f5f5f7;
            padding: 40px;
        }
        .start-page {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .safari-logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* ===== 搜索框容器（新增，用于定位历史下拉） ===== */
        .search-box-wrap {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        .search-box {
            width: 100%;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .search-box svg { width: 20px; height: 20px; fill: #86868b; flex-shrink: 0; }
        .search-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            transition: color 0.3s ease;
            font-family: inherit;
        }

        /* 错误关键词：红色+颤抖动画 */
        .search-box input.error {
            color: #ff3b30;
        }
        .search-box input.shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        /* ===== 搜索历史下拉（新增） ===== */
        .search-history {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 6px;
            text-align: left;
            z-index: 50;
            max-height: 320px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            animation: shFadeIn 0.15s ease-out;
        }
        .search-history.show { display: block; }
        @keyframes shFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .sh-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #1d1d1f;
            transition: background 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .sh-item:hover { background: rgba(0,0,0,0.05); }
        .sh-item:active { background: rgba(0,0,0,0.08); }
        .sh-item .sh-icon {
            width: 16px; height: 16px;
            fill: #86868b;
            flex-shrink: 0;
        }
        .sh-item .sh-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sh-del {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #86868b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s, color 0.12s;
        }
        .sh-del:hover { background: rgba(0,0,0,0.08); color: #1d1d1f; }
        .sh-del:active { background: rgba(0,0,0,0.15); }
        .sh-del svg { width: 13px; height: 13px; fill: currentColor; }

        .sh-clear {
            padding: 10px 12px;
            border-top: 1px solid rgba(0,0,0,0.06);
            font-size: 13px;
            color: #007aff;
            text-align: center;
            cursor: pointer;
            border-radius: 0 0 8px 8px;
            transition: background 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .sh-clear:hover { background: rgba(0,122,255,0.06); }
        .sh-clear:active { background: rgba(0,122,255,0.12); }

        .favorites-title {
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .fav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 12px;
            border-radius: 12px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .fav-item:hover { background: rgba(0,0,0,0.04); }
        .fav-item:active { background: rgba(0,0,0,0.08); }
        .fav-icon {
            width: 56px; height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .fav-name {
            font-size: 12px;
            color: #1d1d1f;
        }

        /* 右下角页码 */
        .page-indicator {
            position: fixed;
            bottom: calc(16px + var(--safe-bottom));
            right: 16px;
            background: #ffffff;
            color: #86868b;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: .5px;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #e2e5ea;
            z-index: 2147483000;
            user-select: none;
            pointer-events: none;
        }
        .page-indicator b {
            color: #1d1d1f;
            font-weight: 600;
        }

        /* 左下角返回按钮 —— 桌面端隐藏，仅手机端显示 */
        .back-link {
            display: none;
            position: fixed;
            bottom: calc(16px + var(--safe-bottom));
            left: 16px;
            background: #ffffff;
            color: #1d1d1f;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #e2e5ea;
            text-decoration: none;
            align-items: center;
            gap: 6px;
            z-index: 2147483000;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link:hover { background: #f5f5f7; }

        /* =========================================================
           手机端适配（≤ 600px）
           ========================================================= */
        @media (max-width: 600px) {

            /* ---------- 菜单栏精简 ---------- */
            .menubar .hide-on-mobile { display: none !important; }
            .menubar { font-size: 12px; padding-left: 12px; padding-right: 12px; }
            .menubar .apple-logo { margin-right: 8px; width: 16px; height: 16px; }
            .menubar .menu-item { padding: 0 6px; }
            .menubar-right { font-size: 11px; gap: 8px; }
            .menubar-right svg { width: 16px; height: 16px; }

            /* ---------- 工具栏 ---------- */
            .browser-toolbar {
                height: 46px;
                padding: 0 8px;
                gap: 4px;
            }
            .traffic-lights { display: none; }
            .nav-btn { width: 34px; height: 34px; }
            .nav-btn svg { width: 17px; height: 17px; }
            .url-bar {
                height: 34px;
                padding: 0 10px;
                gap: 6px;
                border-radius: 10px;
            }
            .url-bar input { font-size: 14px; }
            .share-btn { width: 34px; height: 34px; }

            /* ---------- 标签栏 ---------- */
            .tab-bar {
                height: 32px;
                padding: 0 8px;
            }
            .tab {
                height: 26px;
                padding: 0 10px;
                min-width: 90px;
                max-width: 150px;
                font-size: 11px;
            }
            .tab-new { width: 26px; height: 26px; }

            /* ---------- 内容区 ---------- */
            .browser-content { padding: 24px 16px; }
            .safari-logo { font-size: 52px; margin-bottom: 16px; }

            .search-box-wrap { margin-bottom: 28px; }
            .search-box {
                height: 42px;
                padding: 0 14px;
                gap: 10px;
            }
            /* 16px 防 iOS 自动放大 */
            .search-box input { font-size: 16px; }
            .search-box svg { width: 18px; height: 18px; }

            /* 搜索历史下拉 */
            .search-history {
                padding: 4px;
                max-height: 260px;
                border-radius: 10px;
            }
            .sh-item {
                padding: 11px 10px;
                font-size: 14px;
                border-radius: 6px;
                gap: 8px;
            }
            .sh-del { width: 26px; height: 26px; }
            .sh-del svg { width: 14px; height: 14px; }
            .sh-clear { font-size: 12px; padding: 10px 10px; }

            .favorites-title { font-size: 14px; margin-bottom: 12px; }
            .favorites-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .fav-item { padding: 8px; gap: 6px; }
            .fav-icon {
                width: 48px; height: 48px;
                border-radius: 12px;
                font-size: 22px;
            }
            .fav-name { font-size: 11px; }

            /* ---------- 返回按钮：手机端显示 ---------- */
            .back-link {
                display: inline-flex;
                bottom: calc(12px + var(--safe-bottom));
                left: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        /* =========================================================
           底部角标微调（≤ 640px）—— 与其他页面保持一致
           ========================================================= */
        @media (max-width: 640px) {
            .page-indicator {
                bottom: calc(12px + var(--safe-bottom));
                right: 10px;
                padding: 4px 10px;
                font-size: 11px;
            }
        }

        /* 超窄屏（≤ 360px） */
        @media (max-width: 360px) {
            .favorites-grid { grid-template-columns: repeat(2, 1fr); }
            .tab { min-width: 70px; max-width: 120px; }
            .search-box { height: 40px; }
        }
    </style>
</head>
<body>

    <!-- 右下角页码 -->
    <div class="page-indicator"><b>3</b> / 27</div>

    <!-- 左下角返回（仅手机端显示） -->
    <a href="zhuomian.html" class="back-link">← 返回桌面</a>

    <!-- 全局菜单栏 -->
    <div class="menubar">
        <svg class="apple-logo" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <span class="menu-item bold">Safari</span>
        <span class="menu-item hide-on-mobile">文件</span>
        <span class="menu-item hide-on-mobile">编辑</span>
        <span class="menu-item hide-on-mobile">显示</span>

            <svg class="hide-on-mobile" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span id="menutime"></span>
        </div>
    </div>

    <!-- Safari 应用主体 -->
    <div class="app-container">

        <!-- 工具栏 -->
        <div class="browser-toolbar">
            <div class="traffic-lights">
                <button class="tl-btn tl-close" onclick="location.href='zhuomian.html'" title="关闭"></button>
                <button class="tl-btn tl-min" title="最小化"></button>
                <button class="tl-btn tl-zoom" title="最大化"></button>
            </div>
            <button class="nav-btn" title="后退">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="nav-btn" title="前进">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
            <div class="url-bar">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <input type="text" value="apple.com" placeholder="搜索或输入网站名称">
            </div>
            <button class="share-btn" title="分享">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>

        <!-- 标签页 -->
        <div class="tab-bar">
            <div class="tab active">
                <span>🍎</span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Apple</span>
            </div>
            <div class="tab">
                <span>📖</span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">新标签页</span>
            </div>
            <button class="tab-new">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>

        <!-- 浏览器内容 -->
        <div class="browser-content">
            <div class="start-page">
                <div class="safari-logo">🧭</div>

                <!-- 搜索框 + 历史下拉（外层 wrap 用于定位） -->
                <div class="search-box-wrap" id="searchBoxWrap">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="startSearch" placeholder="搜索或输入网站名称" autocomplete="off">
                    </div>
                    <!-- 历史关键词下拉 -->
                    <div class="search-history" id="searchHistory">
                        <div class="sh-list" id="shList"></div>
                        <div class="sh-clear" id="shClear">清空搜索记录</div>
                    </div>
                </div>

                <div class="favorites-title">个人收藏</div>
                <div class="favorites-grid">
                    <div class="fav-item" onclick="window.open('qiandu.html', '_blank')" style="cursor:pointer;">
                        <div class="fav-icon" style="background:linear-gradient(135deg,#4e6ef2,#6a5af9);">☁️</div>
                        <div class="fav-name">千度网盘</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           菜单栏实时时间
           ========================================================= */
        function updateTime() {
            const now = new Date();
            const days = ['周日','周一','周二','周三','周四','周五','周六'];
            const day = days[now.getDay()];
            const h = now.getHours();
            const m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('menutime').textContent = `${day} ${h}:${m}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        /* =========================================================
           搜索历史存储
           ========================================================= */
        const HISTORY_KEY = 'safari_search_history';
        const MAX_HISTORY = 10;

        function getHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }
        function saveHistory(arr) {
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch (e) {}
        }
        function addHistory(kw) {
            let arr = getHistory().filter(function (x) { return x !== kw; });
            arr.unshift(kw);
            if (arr.length > MAX_HISTORY) arr = arr.slice(0, MAX_HISTORY);
            saveHistory(arr);
        }
        function removeHistory(kw) {
            saveHistory(getHistory().filter(function (x) { return x !== kw; }));
        }
        function clearHistory() {
            saveHistory([]);
        }

        /* =========================================================
           搜索逻辑（把原逻辑抽成函数，供输入框和下拉项复用）
           ========================================================= */
        function performSearch(q) {
            q = (q || '').trim();
            if (!q) return false;

            const qLower = q.toLowerCase();
            let target = null;

            // 1. ID搜索：zzjuly28（不区分大小写）
            if (qLower === 'zzjuly28') {
                target = 'searchzzjuly28.html';
            }
            // 2. 学校搜索：青岚第一高级中学
            else if (q === '青岚第一高级中学') {
                target = 'searchqinglan.html';
            }
            else if (q === '青岚一高') {
                target = 'searchqinglan.html';
            }
            else if (q === '优秀抽样班级') {
                target = 'searchyouxiu.html';
            }
            else if (q === '王信') {
                target = 'searchwangxin.html';
            }
            else if (q === '青岚市中心医院') {
                target = 'searchyiyuan.html';
            }

            // —— 以后加新关键词，就在上面复制 else if 块 ——

            if (target) {
                addHistory(q);   // 只有成功的才记入历史
                window.open(target + '?q=' + encodeURIComponent(q), '_blank');
                return true;
            }
            return false;
        }

        /* =========================================================
           搜索历史下拉 UI
           ========================================================= */
        const searchInput   = document.getElementById('startSearch');
        const searchWrap    = document.getElementById('searchBoxWrap');
        const historyPanel  = document.getElementById('searchHistory');
        const shList        = document.getElementById('shList');
        const shClear       = document.getElementById('shClear');

        function renderHistory() {
            const arr = getHistory();
            if (!arr.length) {
                hideHistory();
                return;
            }
            shList.innerHTML = '';

            arr.forEach(function (kw) {
                const item = document.createElement('div');
                item.className = 'sh-item';

                // 时钟图标
                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                icon.setAttribute('class', 'sh-icon');
                icon.setAttribute('viewBox', '0 0 24 24');
                const iconPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                iconPath.setAttribute('d', 'M13 3a9 9 0 00-9 9H1l4 4 4-4H6a7 7 0 117 7 6.94 6.94 0 01-4.9-2l-1.4 1.4A9 9 0 1013 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z');
                icon.appendChild(iconPath);

                // 关键词文本
                const text = document.createElement('span');
                text.className = 'sh-text';
                text.textContent = kw;

                // 删除按钮
                const del = document.createElement('button');
                del.className = 'sh-del';
                del.type = 'button';
                del.title = '删除';
                del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

                item.appendChild(icon);
                item.appendChild(text);
                item.appendChild(del);

                // 点击整条 → 再次搜索
                item.addEventListener('click', function (e) {
                    if (e.target.closest('.sh-del')) return;
                    searchInput.value = kw;
                    hideHistory();
                    performSearch(kw);
                });

                // 点击 × → 删除单条
                del.addEventListener('click', function (e) {
                    e.stopPropagation();
                    removeHistory(kw);
                    renderHistory();
                });

                shList.appendChild(item);
            });

            historyPanel.classList.add('show');
        }

        function hideHistory() {
            historyPanel.classList.remove('show');
        }

        /* =========================================================
           事件绑定
           ========================================================= */

        // 聚焦搜索框时展开历史（有记录才显示）
        searchInput.addEventListener('focus', function () {
            if (getHistory().length) renderHistory();
        });

        // 回车提交
        searchInput.addEventListener('keypress', function (e) {
            if (e.key !== 'Enter') return;
            const q = this.value.trim();
            if (!q) return;

            hideHistory();

            if (!performSearch(q)) {
                // 未匹配到：变红 + 颤抖，1.2 秒后恢复
                this.classList.add('error', 'shake');
                const self = this;
                setTimeout(function () {
                    self.classList.remove('error', 'shake');
                }, 1200);
            }
        });

        // 清空全部历史
        shClear.addEventListener('click', function (e) {
            e.stopPropagation();
            clearHistory();
            hideHistory();
        });

        // 点击 wrap 之外 → 关闭下拉
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-box-wrap')) hideHistory();
        });

        // Esc → 关闭下拉
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') hideHistory();
        });
    </script>
</body>
</html>
