<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
        }
        /* ===== 全局菜单栏 ===== */
        .menubar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 28px;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 14px;
            z-index: 10000;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            user-select: none;
        }
        .menubar .apple-logo {
            width: 18px;
            height: 18px;
            margin-right: 16px;
            cursor: pointer;
            fill: #1d1d1f;
        }
        .menubar .menu-item {
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: default;
            color: #1d1d1f;
        }
        .menubar .menu-item.bold { font-weight: 700; }
        .menubar .menu-item:hover { background: #007aff; color: #fff; border-radius: 4px; }
        .menubar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #1d1d1f;
        }
        .menubar-right svg {
            width: 18px; height: 18px;
            fill: #1d1d1f;
            opacity: 0.9;
        }
        /* ===== Safari 应用全屏容器 ===== */
        .app-container {
            position: fixed;
            top: 28px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        /* 浏览器工具栏 */
        .browser-toolbar {
            height: 52px;
            background: rgba(245, 245, 247, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }
        .traffic-lights {
            display: flex;
            gap: 8px;
            margin-right: 12px;
        }
        .tl-btn {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .tl-close { background: #ff5f57; }
        .tl-close:hover { background: #ff3b30; }
        .tl-min { background: #febc2e; }
        .tl-zoom { background: #28c840; }
        .nav-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
            opacity: 0.7;
        }
        .nav-btn:hover { background: rgba(0,0,0,0.08); opacity: 1; }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .url-bar {
            flex: 1;
            height: 30px;
            border-radius: 8px;
            background: rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }
        .url-bar svg {
            width: 16px; height: 16px;
            fill: #86868b;
            flex-shrink: 0;
        }
        .url-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            color: #1d1d1f;
        }
        .share-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
            opacity: 0.7;
        }
        .share-btn:hover { background: rgba(0,0,0,0.08); opacity: 1; }
        .share-btn svg { width: 18px; height: 18px; fill: currentColor; }
        /* 标签页 */
        .tab-bar {
            height: 36px;
            background: rgba(240, 240, 242, 0.9);
            display: flex;
            align-items: flex-end;
            padding: 0 12px;
            gap: 2px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .tab {
            height: 28px;
            padding: 0 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 200px;
            min-width: 120px;
            cursor: pointer;
        }
        .tab.active {
            background: #fff;
            font-weight: 500;
        }
        .tab-new {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #86868b;
            margin-left: 4px;
        }
        .tab-new:hover { background: rgba(0,0,0,0.08); color: #1d1d1f; }
        /* 浏览器内容区 */
        .browser-content {
            flex: 1;
            overflow-y: auto;
            background: #f5f5f7;
            padding: 40px;
        }
        .start-page {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .safari-logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            height: 44px;
            margin: 0 auto 40px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .search-box svg { width: 20px; height: 20px; fill: #86868b; }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            transition: color 0.3s ease;
        }
        /* 错误关键词：红色+颤抖动画 */
        .search-box input.error {
            color: #ff3b30;
        }
        .search-box input.shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .favorites-title {
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .fav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 12px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .fav-item:hover { background: rgba(0,0,0,0.04); }
        .fav-icon {
            width: 56px; height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .fav-name {
            font-size: 12px;
            color: #1d1d1f;
        }
		
		/* 右下角页码（方案C：白底细灰边小标签） */
				.page-indicator {
				    position: fixed;
				    bottom: 16px;
				    right: 16px;
				    background: #ffffff;
				    color: #86868b;
				    font-size: 12px;
				    font-weight: 400;
				    letter-spacing: .5px;
				    padding: 5px 12px;
				    border-radius: 8px;
				    border: 1px solid #e2e5ea;
				    z-index: 2147483000;
				    user-select: none;
				}
				.page-indicator b {
				    color: #1d1d1f;
				    font-weight: 600;
				}
				
				/* 左下角返回按钮（与C同款） */
				.back-link {
				    position: fixed;
				    bottom: 16px;
				    left: 16px;
				    background: #ffffff;
				    color: #1d1d1f;
				    font-size: 13px;
				    padding: 8px 14px;
				    border-radius: 8px;
				    border: 1px solid #e2e5ea;
				    text-decoration: none;
				    display: inline-flex;
				    align-items: center;
				    gap: 6px;
				    z-index: 2147483000;
				    transition: background 0.15s;
				    -webkit-tap-highlight-color: transparent;
				}
				.back-link:hover { background: #f5f5f7; }
				
				/* 手机端适配 */
				@media (max-width: 640px) {
				    .page-indicator { bottom: 12px; right: 10px; padding: 4px 10px; font-size: 11px; }
				    .back-link      { bottom: 12px; left: 10px; padding: 8px 12px; font-size: 12px; }
				}
				
				
    </style>
</head>
<body>
	
	<!-- 右下角页码 -->
	<div class="page-indicator"><b>3</b> / 27</div>
	
	
    <!-- 全局菜单栏 -->
    <div class="menubar">
        <svg class="apple-logo" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <span class="menu-item bold">Safari</span>
        <span class="menu-item">文件</span>
        <span class="menu-item">编辑</span>
        <span class="menu-item">显示</span>
        <span class="menu-item">历史记录</span>
        <span class="menu-item">书签</span>
        <span class="menu-item">标签页</span>
        <span class="menu-item">窗口</span>
        <span class="menu-item">帮助</span>
        <div class="menubar-right">
            <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span id="menutime"></span>
        </div>
    </div>
    <!-- Safari 应用主体 -->
    <div class="app-container">
        <!-- 工具栏 -->
        <div class="browser-toolbar">
            <div class="traffic-lights">
                <button class="tl-btn tl-close" onclick="location.href='zhuomian.html'" title="关闭"></button>
                <button class="tl-btn tl-min" title="最小化"></button>
                <button class="tl-btn tl-zoom" title="最大化"></button>
            </div>
            <button class="nav-btn" title="后退">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="nav-btn" title="前进">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
            <div class="url-bar">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <input type="text" value="apple.com" placeholder="搜索或输入网站名称">
            </div>
            <button class="share-btn" title="分享">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>
        <!-- 标签页 -->
        <div class="tab-bar">
            <div class="tab active">
                <span>🍎</span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Apple</span>
            </div>
            <div class="tab">
                <span>📖</span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">新标签页</span>
            </div>
            <button class="tab-new">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
        <!-- 浏览器内容 -->
        <div class="browser-content">
            <div class="start-page">
                <div class="safari-logo">🧭</div>
                <div class="search-box">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="startSearch" placeholder="搜索或输入网站名称">
                </div>
                <div class="favorites-title">个人收藏</div>
                <div class="favorites-grid">
                    
                  
                    
                   <div class="fav-item" onclick="window.open('qiandu.html', '_blank')" style="cursor:pointer;">
                        <div class="fav-icon" style="background:linear-gradient(135deg,#4e6ef2,#6a5af9);">☁️</div>
                        <div class="fav-name">千度网盘</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 实时时间
        function updateTime() {
            const now = new Date();
            const days = ['周日','周一','周二','周三','周四','周五','周六'];
            const day = days[now.getDay()];
            const h = now.getHours();
            const m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('menutime').textContent = `${day} ${h}:${m}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 搜索关键词跳转配置 ==========
        const searchInput = document.getElementById('startSearch');
        searchInput.addEventListener('keypress', function(e) {
            if (e.key !== 'Enter') return;
            const q = this.value.trim();
            if (!q) return;
            const qLower = q.toLowerCase();

            // 正确关键词列表
            let isMatch = false;

            // 1. ID搜索：zzjuly28（不区分大小写）
            if (qLower === 'zzjuly28') {
                isMatch = true;
                 window.open('searchzzjuly28.html?q=' + encodeURIComponent(q), '_blank');
            }
            // 2. 学校搜索：青岚第一高级中学（精确匹配）
            else if (q === '青岚第一高级中学') {
                isMatch = true;
                 window.open('searchqinglan.html?q=' + encodeURIComponent(q), '_blank');
            }
			
			else if (q === '青岚一高') {
			    isMatch = true;
			    window.open('searchqinglan.html?q=' + encodeURIComponent(q), '_blank');
			}
			
			else if (q === '优秀抽样班级') {
			    isMatch = true;
			    window.open('searchyouxiu.html?q=' + encodeURIComponent(q), '_blank');
			}
			
			else if (q === '王信') {
			    isMatch = true;
			     window.open('searchwangxin.html?q=' + encodeURIComponent(q), '_blank');
			}
			
			else if (q === '青岚市中心医院') {
			    isMatch = true;
			    window.open('searchyiyuan.html?q=' + encodeURIComponent(q), '_blank');
			}
			
			

            // —— 以后加新关键词，就在上面复制 else if 块 ——

            // 未匹配到：触发错误提示（变红+颤抖，1.2秒后恢复）
            if (!isMatch) {
                this.classList.add('error', 'shake');
                setTimeout(() => {
                    this.classList.remove('error', 'shake');
                }, 1200);
            }
        });
    </script>
</body>
</html>
