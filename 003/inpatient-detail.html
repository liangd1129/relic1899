<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>住院记录 | 青岚市中心医院</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f2f6f5;
    color: #333;
    line-height: 1.7;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(40px + var(--safe-top)) 20px calc(40px + var(--safe-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  .close-btn {
    position: fixed;
    top: calc(14px + var(--safe-top));
    right: 16px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .close-btn:hover { background: #fff; }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }
  .page-head {
    text-align: center;
    margin-bottom: 26px;
  }
  .page-head h1 {
    font-size: 24px;
    color: #2d5a4f;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .page-head p {
    font-size: 13px;
    color: #8aa89e;
    letter-spacing: 1px;
  }

  .record-card {
    background: #fff;
    border: 1px solid #d8e8e3;
    border-radius: 10px;
    padding: 32px 38px;
    box-shadow: 0 4px 16px rgba(74,156,140,0.08);
  }

  .record-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px dashed #e0ece8;
    flex-wrap: wrap;
  }
  .record-head .record-tag {
    background: #e8f2ef;
    color: #2d5a4f;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 10px;
  }
  .record-head .record-title {
    font-size: 20px;
    font-weight: 600;
    color: #2d5a4f;
  }

  /* 基本信息表格 */
  .info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 26px;
    font-size: 14px;
    table-layout: fixed;
  }
  .info-table td {
    border: 1px solid #e0ece8;
    padding: 10px 14px;
    vertical-align: middle;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .info-table td.lbl {
    background: #f4f9f7;
    color: #5a7d73;
    width: 110px;
    white-space: nowrap;
  }
  .info-table td.val {
    color: #333;
  }

  /* 分区 */
  .block {
    margin-bottom: 24px;
  }
  .block:last-child { margin-bottom: 0; }
  .block-title {
    font-size: 15px;
    font-weight: 700;
    color: #2d5a4f;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid #4a9c8c;
    letter-spacing: 1px;
  }
  .block p {
    font-size: 14px;
    color: #444;
    line-height: 1.95;
    margin-bottom: 8px;
    text-indent: 2em;
  }
  .block p:last-child { margin-bottom: 0; }

  /* 诊断框 */
  .diagnosis-box {
    background: #eef7f4;
    border-left: 3px solid #4a9c8c;
    border-radius: 4px;
    padding: 16px 22px;
    font-size: 15px;
    color: #2d5a4f;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* 诊疗计划 */
  .plan-list {
    list-style: none;
    counter-reset: plan;
  }
  .plan-list li {
    font-size: 14px;
    color: #444;
    line-height: 1.95;
    padding: 8px 0 8px 32px;
    position: relative;
    counter-increment: plan;
    border-bottom: 1px dashed #e8efec;
  }
  .plan-list li:last-child { border-bottom: none; }
  .plan-list li::before {
    content: counter(plan) ".";
    position: absolute;
    left: 8px;
    top: 8px;
    color: #4a9c8c;
    font-weight: 600;
  }
  .plan-list li .plan-tag {
    display: inline-block;
    background: #e8f2ef;
    color: #2d5a4f;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 8px;
    margin-right: 6px;
    vertical-align: 1px;
  }

  /* 右下角页码 */
  .page-indicator {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    right: 16px;
    background: #ffffff;
    color: #86868b;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .5px;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid #e2e5ea;
    z-index: 2147483000;
    user-select: none;
    pointer-events: none;
  }
  .page-indicator b { color: #1d1d1f; font-weight: 600; }

  /* 左下角返回按钮 —— 桌面、手机都显示 */
  .back-link {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    left: 16px;
    background: #ffffff;
    color: #1d1d1f;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #e2e5ea;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 2147483000;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-link:hover { background: #f5f5f7; }

  /* =========================================================
     手机端适配（≤ 600px）
     ========================================================= */
  @media (max-width: 600px) {

    /* ---------- 关闭按钮 ---------- */
    .close-btn {
      top: calc(8px + var(--safe-top));
      right: 10px;
      width: 28px; height: 28px;
      font-size: 14px;
    }

    /* ---------- 页面整体 padding ---------- */
    body {
      padding: calc(56px + var(--safe-top)) 12px calc(80px + var(--safe-bottom));
    }

    /* ---------- 页头 ---------- */
    .page-head { margin-bottom: 18px; }
    .page-head h1 { font-size: 20px; letter-spacing: 1px; }
    .page-head p { font-size: 12px; letter-spacing: 0.5px; }

    /* ---------- 卡片 ---------- */
    .record-card {
      padding: 22px 18px;
      border-radius: 10px;
    }

    /* ---------- 头部 ---------- */
    .record-head {
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
    }
    .record-head .record-tag { font-size: 11px; padding: 3px 10px; }
    .record-head .record-title { font-size: 17px; }

    /* ---------- 信息表：手机上更紧凑 ---------- */
    .info-table {
      font-size: 12.5px;
      margin-bottom: 20px;
    }
    .info-table td {
      padding: 7px 9px;
      line-height: 1.5;
    }
    .info-table td.lbl {
      width: 74px;
      font-size: 12px;
      letter-spacing: 0;
    }

    /* ---------- 分区 ---------- */
    .block { margin-bottom: 18px; }
    .block-title {
      font-size: 13.5px;
      margin-bottom: 10px;
      padding-left: 8px;
      letter-spacing: 0.5px;
    }
    .block p {
      font-size: 13.5px;
      line-height: 1.85;
      margin-bottom: 6px;
    }

    /* ---------- 诊断框 ---------- */
    .diagnosis-box {
      padding: 12px 16px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* ---------- 诊疗计划 ---------- */
    .plan-list li {
      font-size: 13.5px;
      line-height: 1.85;
      padding: 7px 0 7px 26px;
    }
    .plan-list li::before {
      left: 6px;
      top: 7px;
    }
    .plan-list li .plan-tag {
      font-size: 10px;
      padding: 1px 6px;
      margin-right: 4px;
    }

    /* ---------- 返回按钮 ---------- */
    .back-link {
      bottom: calc(12px + var(--safe-bottom));
      left: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }
  }

  /* =========================================================
     底部页码微调（≤ 640px）—— 与其他页面保持一致
     ========================================================= */
  @media (max-width: 640px) {
    .page-indicator {
      bottom: calc(12px + var(--safe-bottom));
      right: 10px;
      padding: 4px 10px;
      font-size: 11px;
    }
  }

  /* 超窄屏（≤ 360px） */
  @media (max-width: 360px) {
    .page-head h1 { font-size: 18px; }
    .page-head p { font-size: 11.5px; }
    .record-card { padding: 18px 14px; }
    .info-table { font-size: 12px; }
    .info-table td { padding: 6px 8px; }
    .info-table td.lbl { width: 66px; font-size: 11.5px; }
    .block p { font-size: 13px; }
    .plan-list li { font-size: 13px; padding-left: 24px; }
  }
</style>
</head>
<body>

<!-- 右下角页码 -->
<div class="page-indicator"><b>25</b> / 27</div>

<!-- 左下角返回按钮 —— 跳回医院首页 -->
<a href="yiyuan-official.html" class="back-link">← 返回医院首页</a>

<div class="container">
  <div class="page-head">
    <h1>住院记录</h1>
    <p>青岚市中心医院 · 住院部</p>
  </div>

  <div class="record-card" id="recordCard"></div>
</div>

<script>
  function formatDate(s) {
    if (!s || s.length !== 8) return s;
    return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
  }

  var record = null;
  try {
    record = JSON.parse(localStorage.getItem('inpRecord') || 'null');
  } catch (e) {
    record = null;
  }

  if (!record) {
    document.getElementById('recordCard').innerHTML =
      '<p style="font-size:14px;color:#9a4a4a;text-align:center;padding:20px 0;">'
      + '未获取到查询结果，请返回医院首页重新查询。</p>';
  } else {
    document.getElementById('recordCard').innerHTML = ''
      + '<div class="record-head">'
      +   '<span class="record-tag">住院记录</span>'
      +   '<span class="record-title">' + record.name + '</span>'
      + '</div>'

      /* 基本信息 */
      + '<table class="info-table">'
      +   '<tr>'
      +     '<td class="lbl">住院号</td>'
      +     '<td class="val">ZY20260928-036</td>'
      +     '<td class="lbl">入院日期</td>'
      +     '<td class="val">' + formatDate(record.admitDate) + '</td>'
      +   '</tr>'
      +   '<tr>'
      +     '<td class="lbl">患者姓名</td>'
      +     '<td class="val">' + record.name + '</td>'
      +     '<td class="lbl">性别 / 年龄</td>'
      +     '<td class="val">' + record.gender + ' / ' + record.age + ' 岁</td>'
      +   '</tr>'
      +   '<tr>'
      +     '<td class="lbl">住院科室</td>'
      +     '<td class="val">' + record.dept + '</td>'
      +     '<td class="lbl">住院房间</td>'
      +     '<td class="val">' + record.room + ' 室</td>'
      +   '</tr>'
      +   '<tr>'
      +     '<td class="lbl">护理等级</td>'
      +     '<td class="val">二级护理</td>'
      +     '<td class="lbl">饮食</td>'
      +     '<td class="val">半流质</td>'
      +   '</tr>'
      +   '<tr>'
      +     '<td class="lbl">联系电话</td>'
      +     '<td class="val">1678820305</td>'
      +     '<td class="lbl">陪护</td>'
      +     '<td class="val">母亲 王丽</td>'
      +   '</tr>'
      + '</table>'

      /* 现病史 */
      + '<div class="block">'
      +   '<div class="block-title">现病史</div>'
      +   '<p>患者于 2026 年 7 月 28 日在校内目睹班内两位学生坠楼，当场晕倒，之后于医院看望二人并留下手机号作为联系人。其中一名学生经抢救无效死亡，另一名学生受伤。此后逐渐出现情绪低落、兴趣减退、回避社交等表现。夜间入睡困难，需较长时间方可入睡，睡后易惊醒，反复出现与事件相关的噩梦，常从梦中惊醒，醒后难以再次入睡。白天精神萎靡，注意力难以集中，工作效率明显下降，对既往感兴趣的事物失去兴趣。</p>'
      +   '<p>近两月食欲明显减退，进食量减少，自觉食物无味，进食后偶有腹胀感，体重持续下降，家属述“肉眼可见地瘦了一圈”。患者本人未主动就医，在母亲一再要求下，于今日来院就诊，门诊以“应激相关障碍”收入院。</p>'
      + '</div>'

      /* 既往史 */
      + '<div class="block">'
      +   '<div class="block-title">既往史</div>'
      +   '<p>既往体健，否认高血压、糖尿病、心脏病等慢性病史，否认药物过敏史，否认精神疾病家族史。</p>'
      + '</div>'

      /* 体格检查 */
      + '<div class="block">'
      +   '<div class="block-title">体格检查</div>'
      +   '<p>神志清楚，精神萎靡，面色萎黄，眼周可见明显色素沉着。形体明显消瘦，皮下脂肪层变薄，肌肉松弛，皮肤弹性减退，锁骨上窝及肋间隙凹陷明显。心肺腹查体未见明显异常，神经系统查体未见阳性体征。</p>'
      + '</div>'

      /* 辅助检查 */
      + '<div class="block">'
      +   '<div class="block-title">辅助检查</div>'
      +   '<p>血常规：血红蛋白轻度偏低，余未见明显异常。</p>'
      +   '<p>生化：白蛋白略低于正常范围，电解质正常。</p>'
      +   '<p>甲状腺功能：未见明显异常。</p>'
      +   '<p>心电图：窦性心律，大致正常。</p>'
      + '</div>'

      /* 初步诊断 */
      + '<div class="block">'
      +   '<div class="block-title">初步诊断</div>'
      +   '<div class="diagnosis-box">应激相关障碍</div>'
      + '</div>'

      /* 诊疗计划 */
      + '<div class="block">'
      +   '<div class="block-title">诊疗计划</div>'
      +   '<ol class="plan-list">'
      +     '<li><span class="plan-tag">入院当日</span>办理入院手续，二级护理，安排床位，评估入院时情绪、睡眠、进食及体重情况。</li>'
      +     '<li><span class="plan-tag">入院当日</span>完善血常规、生化、甲状腺功能、心电图等入院常规检查。</li>'
      +     '<li><span class="plan-tag">入院当日</span>予营养支持，鼓励少量多餐，监测每日进食量及体重变化。</li>'
      +     '<li><span class="plan-tag">入院当日</span>予支持性心理治疗，安抚情绪，嘱家属加强陪护，密切观察情绪及睡眠变化。</li>'
      +     '<li><span class="plan-tag">入院当日</span>根据情况予助眠及情绪稳定药物，剂量由主管医生根据病情调整。</li>'
      +     '<li><span class="plan-tag">后续</span>动态评估情绪及睡眠改善情况，必要时请精神科会诊。</li>'
      +   '</ol>'
      + '</div>';
  }
</script>

</body>
</html>
