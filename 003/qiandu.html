<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千度网盘 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    position: relative;
  }
  .close-btn {
    position: fixed;
    top: 18px;
    right: 20px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    z-index: 100;
  }
  .close-btn:hover { background: rgba(0,0,0,0.15); }

  /* 顶栏 */
  .top-bar {
    background: #fff;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eef0f3;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #4e6ef2 0%, #6a5af9 100%);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 600;
  }
  .logo-text {
    font-size: 22px;
    font-weight: 600;
    color: #1f2d3d;
  }
  .top-links a {
    margin-left: 24px;
    color: #5e6d82;
    text-decoration: none;
    font-size: 14px;
  }
  .top-links a:hover { color: #4e6ef2; }

  /* 主体 */
  .main {
    display: flex;
    justify-content: center;
    padding: 70px 20px 40px;
  }
  .login-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(31,45,61,0.08);
    width: 400px;
    padding: 36px 40px 30px;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid #eef0f3;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    cursor: pointer;
    color: #8a94a6;
    font-size: 15px;
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .tab.active {
    color: #4e6ef2;
    border-bottom-color: #4e6ef2;
    font-weight: 500;
  }
  .form-item { margin-bottom: 16px; }
  .form-item input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    background: #fafbfc;
  }
  .form-item input:focus {
    border-color: #4e6ef2;
    background: #fff;
  }
  .form-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    font-size: 13px;
    color: #8a94a6;
  }
  .form-row label {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer;
  }
  .form-row a {
    color: #4e6ef2;
    text-decoration: none;
  }
  .login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #4e6ef2 0%, #6a5af9 100%);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: opacity .2s;
  }
  .login-btn:hover { opacity: 0.92; }

  .divider {
    margin: 26px 0 18px;
    text-align: center;
    color: #aab2c0;
    font-size: 13px;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 75px;
    height: 1px;
    background: #eef0f3;
  }
  .divider::before { left: 30px; }
  .divider::after { right: 30px; }

  .other-icons {
    display: flex;
    justify-content: center;
    gap: 22px;
  }
  .other-icons span {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #f4f6f9;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    cursor: pointer;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: #8a94a6;
  }
  .footer a {
    color: #8a94a6;
    text-decoration: none;
    margin: 0 8px;
  }
  .footer a:hover { color: #4e6ef2; }

  /* 登录错误提示 */
  .err-msg {
    color: #e6432d;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }

  /* 密码框小眼睛（SVG 图标） */
  .pwd-wrap {
    position: relative;
  }
  .pwd-wrap input {
    width: 100%;
    padding-right: 42px;
  }
  .pwd-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #99aabb;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    line-height: 1;
    transition: color .2s;
  }
  .pwd-eye:hover {
    color: #4e6ef2;
  }
  .pwd-eye svg {
    width: 18px;
    height: 18px;
    display: block;
  }
  
  /* 右下角页码（方案C：白底细灰边小标签） */
  		.page-indicator {
  		    position: fixed;
  		    bottom: 16px;
  		    right: 16px;
  		    background: #ffffff;
  		    color: #86868b;
  		    font-size: 12px;
  		    font-weight: 400;
  		    letter-spacing: .5px;
  		    padding: 5px 12px;
  		    border-radius: 8px;
  		    border: 1px solid #e2e5ea;
  		    z-index: 2147483000;
  		    user-select: none;
  		}
  		.page-indicator b {
  		    color: #1d1d1f;
  		    font-weight: 600;
  		}
  		
  		/* 左下角返回按钮（与C同款） */
  		.back-link {
  		    position: fixed;
  		    bottom: 16px;
  		    left: 16px;
  		    background: #ffffff;
  		    color: #1d1d1f;
  		    font-size: 13px;
  		    padding: 8px 14px;
  		    border-radius: 8px;
  		    border: 1px solid #e2e5ea;
  		    text-decoration: none;
  		    display: inline-flex;
  		    align-items: center;
  		    gap: 6px;
  		    z-index: 2147483000;
  		    transition: background 0.15s;
  		    -webkit-tap-highlight-color: transparent;
  		}
  		.back-link:hover { background: #f5f5f7; }
  		
  		/* 手机端适配 */
  		@media (max-width: 640px) {
  		    .page-indicator { bottom: 12px; right: 10px; padding: 4px 10px; font-size: 11px; }
  		    .back-link      { bottom: 12px; left: 10px; padding: 8px 12px; font-size: 12px; }
  		}
		
		
</style>
</head>
<body>


<!-- 右下角页码 -->
<div class="page-indicator"><b>4</b> / 27</div>



<div class="top-bar">
  <div class="logo">
    <div class="logo-icon">千</div>
    <div class="logo-text">千度网盘</div>
  </div>
  <div class="top-links">
    <a href="#">客户端下载</a>
    <a href="#">帮助中心</a>
  </div>
</div>

<div class="main">
  <div class="login-card">
    <div class="tabs">
      <div class="tab">扫码登录</div>
      <div class="tab active">账号登录</div>
    </div>

    <div class="form-item">
      <input type="text" id="account" placeholder="手机号 / 邮箱 / 千度ID" autocomplete="off">
    </div>
    <div class="form-item">
      <div class="pwd-wrap">
        <input type="password" id="password" placeholder="密码" autocomplete="off">
        <span class="pwd-eye" id="pwdEye">
          <!-- 睁眼图标（默认：密码隐藏，点击显示） -->
          <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- 闭眼图标（密码明文时显示） -->
          <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </span>
      </div>
      <div class="err-msg" id="errMsg">账号或密码错误，请重试</div>
    </div>

    <div class="form-row">
      <label><input type="checkbox" checked> 记住我</label>
      <a href="#">忘记密码</a>
    </div>

    <button class="login-btn" onclick="tryLogin()">登 录</button>

    <div class="divider">其他方式登录</div>
    <div class="other-icons">
      <span title="微信">💬</span>
      <span title="短信">📱</span>
      <span title="QQ">💚</span>
    </div>
  </div>
</div>

<div class="footer">
  <a href="#">注册账号</a>|
  <a href="#">千度首页</a>|
  <a href="#">用户协议</a>|
  <a href="#">隐私政策</a>
</div>

<script>
  const CORRECT_ACCOUNT = '1673994233';
  const CORRECT_PWD = 'spiderbutterfly';

  function tryLogin() {
    var acc = document.getElementById('account').value.trim();
    var pwd = document.getElementById('password').value.trim();
    var errMsg = document.getElementById('errMsg');

    if (!acc || !pwd) {
      errMsg.textContent = '请输入账号和密码';
      errMsg.style.display = 'block';
      return;
    }

    if (acc === CORRECT_ACCOUNT && pwd === CORRECT_PWD) {
      window.location.href = 'wangpan.html';
    } else {
      errMsg.textContent = '账号或密码错误，请重试';
      errMsg.style.display = 'block';
    }
  }

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });

  // 密码小眼睛
  const pwdEye = document.getElementById('pwdEye');
  const pwdInput = document.getElementById('password');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');

  if (pwdEye && pwdInput && eyeOpen && eyeClosed) {
    pwdEye.addEventListener('click', function() {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        pwdInput.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    });
  }
</script>
</body>
</html>
